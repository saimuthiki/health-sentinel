name: Android app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # The `secrets` context is not available in a step-level `if`, but it is
      # available here. Steps branch on this string instead.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # Repository VARIABLES, not secrets, and deliberately so: all three are
      # meant to be readable inside the installed app. The Supabase anon key is
      # designed to ship in a client and is safe there precisely because row
      # level security is on -- 34 tables, 107 policies. The service-role key is
      # the dangerous one and never comes near this workflow or the app.
      #
      # They live here rather than in the code because rotating the Supabase JWT
      # secret reissues the anon key, and that should be a one-field edit in
      # GitHub rather than a code change and a review.
      #
      # Set them at: Settings -> Secrets and variables -> Actions -> Variables.
      # Left unset, the build still succeeds and the app opens on its
      # "Not connected yet" screen, which is the correct unconfigured behaviour.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the first successful resolve used. An unpinned
          # toolchain plus an unpinned dependency set means a build that works today
          # can break tomorrow with no change from us.
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter version in use
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # The lock file records the exact version of every package this build
      # resolved. It belongs in the repository, but it can only be generated by
      # the Flutter toolchain, and the only machine here that has one is this
      # runner. Uploading it means the pin can be taken from a build that is
      # known green, rather than asking somebody to install a two-gigabyte SDK
      # to produce one file.
      - name: Upload the resolved lock file
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Restore signing key
        # Only when the four secrets are present. Without them the release build
        # falls back to debug signing, which still installs on a phone -- it just
        # cannot go to the Play Store. See docs/06-your-manual-steps.md step M7.
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          PROPS

      - name: Report how this build is configured
        # Says which values are present without printing any of them.
        run: |
          echo "SUPABASE_URL   : ${SUPABASE_URL:+set}${SUPABASE_URL:-NOT SET}"
          echo "SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:+set}${SUPABASE_ANON_KEY:-NOT SET}"
          echo "API_BASE_URL   : ${API_BASE_URL:+set}${API_BASE_URL:-NOT SET}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$API_BASE_URL" ]; then
            echo "::notice::Building UNCONFIGURED. The app will open on 'Not connected yet'."
          else
            echo "::notice::Building configured against $API_BASE_URL"
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build App Bundle
        # The Play Store takes .aab, not .apk. Sideloading to your own phone takes .apk.
        if: env.HAS_KEYSTORE == 'true'
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Remove signing material
        if: always()
        run: rm -f android/upload.jks android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthpulse-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: healthpulse-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
