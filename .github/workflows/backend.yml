name: Backend

on:
  # db/seed is in here because backend/app/rules/biomarker_vocabulary.py mirrors
  # db/seed/200_biomarkers.sql and db/seed/201_biomarker_synonyms.sql, and the safety
  # validator's dual-use drug set is derived from that mirror. A biomarker seeded
  # without the mirror being updated is a report that 500s, so the parity test in
  # backend/tests/safety/test_dual_use_analytes.py has to run on a db-only change too.
  push:
    paths: ['backend/**', 'db/seed/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'db/seed/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Test
        # No network is available to these tests by design -- every Gemini call is
        # mocked. A test that reaches out is a bug, not a flake.
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Assert no secret is committed
        working-directory: .
        run: |
          if grep -rniE "GEMINI_API_KEY[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_.-]{15,}" \
               --exclude-dir=.git --exclude=.env.example . ; then
            echo "::error::A value that looks like a real API key is committed."
            exit 1
          fi
          echo "No committed secrets found."
