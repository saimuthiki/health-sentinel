# Commit the resolved dependency versions.
#
# pubspec.lock can only be produced by the Flutter toolchain, and the only
# machine in this project that has one is a CI runner - the app is authored in
# an environment with no Dart SDK. So rather than ask somebody to install a
# two-gigabyte SDK to generate a single text file, the runner that already
# resolves dependencies on every build commits what it resolved.
#
# Run this by hand from the Actions tab. It is deliberately not automatic: a job
# that pushes to main on every build is a job that will surprise somebody one
# day, and pinning is a decision rather than a routine.
name: Pin dependencies

on:
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    # The only job in this repository allowed to write to the repository, and it
    # writes exactly one file.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check the lock file looks like one
        run: |
          test -s pubspec.lock
          head -1 pubspec.lock | grep -q "Generated by pub"
          grep -q "^sdks:" pubspec.lock
          echo "pubspec.lock is $(wc -l < pubspec.lock) lines"

      - name: Commit it, if it changed
        run: |
          if git diff --quiet -- pubspec.lock && git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "Already committed and unchanged. Nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(app): pin every package to the versions a green build resolved

          Without this file each build re-resolves and can pick different
          versions of the same dependency. That is not hypothetical here: one
          build resolved file_picker 8.3.7 where the code had been read against
          8.1.6, and image_picker 1.2.3 against 1.1.2.

          Generated by the Flutter toolchain on a CI runner, because there is no
          Dart SDK in the authoring environment and a hand-written lock file
          would be a fabrication."
          git push
