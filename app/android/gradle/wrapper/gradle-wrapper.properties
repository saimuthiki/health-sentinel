# Gradle 8.14+ is required by the Flutter Gradle plugin from Flutter 3.47 onwards.
# Without this file the tool injects its own wrapper at 8.9.0 and the build fails
# with "Your project's Gradle version (8.9.0) is lower than Flutter's minimum
# supported version of 8.14.0".
#
# Only this properties file is committed. gradlew, gradlew.bat and
# gradle-wrapper.jar stay out of the repository: the Flutter tool copies any
# wrapper file that is missing, per file, so it still supplies the script and the
# jar while leaving the version pinned here alone. Committing the jar would mean
# committing a binary we cannot inspect.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
