pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter 3.47's Gradle plugin requires AGP 8.11.1 or newer and rejects
    // anything older outright. Deliberately staying on the 8.x line rather than
    // moving to AGP 9: from 9.0 only the new DSL is read, which would require
    // rewriting app/build.gradle. That migration is worth doing on purpose, with
    // a build to test it against -- not as a side effect of unblocking CI.
    id "com.android.application" version "8.11.1" apply false
    // Flutter 3.47 requires Kotlin 2.2.20 or newer. Its Gradle plugin validates
    // Gradle, then AGP, then Kotlin, and reports only the first failure it finds,
    // so these three surfaced one build at a time rather than together.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
